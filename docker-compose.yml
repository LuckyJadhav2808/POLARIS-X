version: '3.8'

services:
  # ============================================================================
  # POLARIS-X FastAPI Backend Service (Routing, Risk Grid & XAI Engine)
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: polaris-x-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - PROJECT_NAME=POLARIS-X Maritime Navigation Engine
      - HOST=0.0.0.0
      - PORT=8000
    networks:
      - polaris-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================================
  # POLARIS-X Next.js 14 Frontend Console (Executive Maritime Bridge)
  # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: polaris-x-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - polaris-net

networks:
  polaris-net:
    driver: bridge
